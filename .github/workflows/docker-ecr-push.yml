# Amazon ECR에 백엔드·프론트 이미지 빌드 후 푸시
#
# GitHub 저장소 Settings → Secrets and variables:
#   Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   Variables: AWS_REGION (예: ap-northeast-2), ECR_REPO_BACKEND, ECR_REPO_FRONTEND
#   VITE_API_BASE_URL (선택, 미설정 시 https://sbc365.co.kr/api)
#
# AWS에서 먼저 ECR 리포지토리 생성:
#   aws ecr create-repository --repository-name capstone-backend --region ap-northeast-2
#   aws ecr create-repository --repository-name capstone-frontend --region ap-northeast-2

name: Docker build and push to ECR

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  ECR_BACKEND: ${{ vars.ECR_REPO_BACKEND || 'capstone-backend' }}
  ECR_FRONTEND: ${{ vars.ECR_REPO_FRONTEND || 'capstone-frontend' }}

jobs:
  push-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$ECR_BACKEND:$GITHUB_SHA" -t "$REGISTRY/$ECR_BACKEND:latest" ./backend
          docker push "$REGISTRY/$ECR_BACKEND:$GITHUB_SHA"
          docker push "$REGISTRY/$ECR_BACKEND:latest"

      - name: Build and push frontend
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://sbc365.co.kr/api' }}
        run: |
          docker build \
            --build-arg "VITE_API_BASE_URL=$VITE_API_BASE_URL" \
            -t "$REGISTRY/$ECR_FRONTEND:$GITHUB_SHA" \
            -t "$REGISTRY/$ECR_FRONTEND:latest" \
            ./frontend
          docker push "$REGISTRY/$ECR_FRONTEND:$GITHUB_SHA"
          docker push "$REGISTRY/$ECR_FRONTEND:latest"
