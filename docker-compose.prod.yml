# 프로덕션용 로컬/서버 스택 (EC2 등에서 docker compose -f docker-compose.prod.yml up -d)
#
# 사전 준비:
#   cp .env.production.example .env.production   후 값 채우기
#   프론트 API URL: VITE_API_BASE_URL=https://<공개도메인>/api  (끝에 /api)
#
# 빌드:
#   docker compose -f docker-compose.prod.yml --env-file .env.production build
# 기동:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped
